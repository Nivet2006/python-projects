{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
</head>

<body>

    <header>
        <h1>My Personal Profile</h1>

        <nav>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>

        <section id="about">
            <h2>About Me</h2>

            <p>
                Hello! My name is Nived.
                I am learning Python and Django.
                I enjoy developing websites.
            </p>

            <button onclick="showWelcome()">
                Click Me
            </button>
        </section>

        <section id="skills">
            <h2>My Skills</h2>

            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Python</li>
                <li>Django</li>
            </ul>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>

            <form id="contactForm">

                <input type="text"
                       id="name"
                       placeholder="Enter your name"
                       required>

                <input type="email"
                       id="email"
                       placeholder="Enter your email"
                       required>

                <textarea id="message"
                          placeholder="Your message"
                          required></textarea>

                <button type="submit">
                    Send Message
                </button>

            </form>

            <p id="result"></p>
        </section>

    </main>

    <footer>
        <p>© 2026 My Profile Website</p>
    </footer>

    <script src="{% static 'js/script.js' %}"></script>

</body>
</html>
